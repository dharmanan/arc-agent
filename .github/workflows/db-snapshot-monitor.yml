# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: DB Snapshot Monitor

"on":
  schedule:
    - cron: '49 23 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  db-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: production
      DATABASE_URL: ${{ secrets.DB_SNAPSHOT_DATABASE_URL }}
      SNAPSHOT_MAX_DB_BYTES: ${{ vars.SNAPSHOT_MAX_DB_BYTES }}
      SNAPSHOT_MAX_CHAIN_EVENTS_BYTES: ${{ vars.SNAPSHOT_MAX_CHAIN_EVENTS_BYTES }}
      SNAPSHOT_MAX_PENDING_ROWS: ${{ vars.SNAPSHOT_MAX_PENDING_ROWS }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Validate snapshot secret
        working-directory: backend
        run: |
          if [[ -z "$DATABASE_URL" ]]; then
            echo "Missing GitHub secret DB_SNAPSHOT_DATABASE_URL" >&2
            exit 1
          fi

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --omit=dev --ignore-scripts

      - name: Run DB snapshot
        id: snapshot
        continue-on-error: true
        working-directory: backend
        run: |
          npm run db:snapshot -- \
            --json-out artifacts/db-snapshot.json \
            --md-out artifacts/db-snapshot.md

      - name: Publish workflow summary
        if: always()
        working-directory: backend
        run: |
          if [[ -f artifacts/db-snapshot.md ]]; then
            cat artifacts/db-snapshot.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo '# DB Snapshot' >> "$GITHUB_STEP_SUMMARY"
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo '- Snapshot summary was not generated.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload snapshot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: db-snapshot-${{ github.run_id }}
          path: |
            backend/artifacts/db-snapshot.json
            backend/artifacts/db-snapshot.md
          if-no-files-found: warn

      - name: Enforce snapshot result
        if: steps.snapshot.outcome == 'failure'
        run: |
          echo 'DB snapshot failed or exceeded a configured threshold.' >&2
          exit 1